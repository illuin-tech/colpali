# Per-op MaxSim VRAM sweep: for each batch size and backend, run a few ColQwen2
# training steps with the maxsim dispatchers instrumented, recording each call's
# transient forward peak and the bytes retained for backward.
#
# Fresh process per (B, backend) so a CUDA OOM is isolated; bench_train.py catches
# OOM and writes an {"oom": true} marker (exit 0) with the calls recorded so far.
#
#   sky launch -c colpali-lik-vram bench_lik/sky_maxsim_vram_sweep.yaml
#
# Results: bench_lik/results/maxsim_vram_b<B>_<backend>.json (also echoed to the log).
# Pull: rsync -avP 'colpali-lik-vram:sky_workdir/bench_lik/results/' ./bench_lik/results/

name: colpali-lik-vram

resources:
  infra: kubernetes
  image_id: docker:nvidia/cuda:12.4.1-runtime-ubuntu22.04
  accelerators: H100:1
  cpus: 8+
  memory: 64+
  # Generous idle window so a dropped log stream can't race teardown before results
  # are pulled (the run itself is short).
  autostop:
    idle_minutes: 60
    down: true

workdir: .

envs:
  HF_HOME: /tmp/hf_home
  USE_LOCAL_DATASET: "0"

setup: |
  set -eux
  cd ~/sky_workdir
  apt-get update && apt-get install -y --no-install-recommends curl ca-certificates git
  curl -LsSf https://astral.sh/uv/install.sh | sh
  export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
  uv venv --clear --python 3.11 .venv
  source .venv/bin/activate
  uv pip install -e ".[train,lik]"

run: |
  set -uxo pipefail
  cd ~/sky_workdir
  export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
  source .venv/bin/activate

  python -c "import torch; print('GPU:', torch.cuda.get_device_name(), torch.cuda.get_device_properties(0).total_memory/1024**3, 'GiB')"
  python -c "import late_interaction_kernels as lik; print('LIK:', getattr(lik, '__version__', '?'))"

  mkdir -p bench_lik/results
  emit() { echo "=================== RESULT $1 ==================="; cat "$1"; echo; echo "=================== END $1 ==================="; }

  BATCH_SIZES="16 32 64 128"

  for B in $BATCH_SIZES; do
    for BACKEND in auto torch; do
      out="bench_lik/results/maxsim_vram_b${B}_${BACKEND}.json"
      echo "==================================================="
      echo "batch_size=$B · COLPALI_SCORES_BACKEND=$BACKEND"
      echo "==================================================="
      # bench_train exits 0 on OOM (writes an oom marker). A non-zero exit is a real
      # crash; record it so the sweep keeps going.
      COLPALI_SCORES_BACKEND="$BACKEND" python bench_lik/bench_train.py \
        --config bench_lik/bench_config_subset.yaml \
        --batch-size "$B" --max-steps 4 \
        --output "$out" \
        || printf '{"batch_size": %s, "colpali_scores_backend": "%s", "crashed": true}\n' "$B" "$BACKEND" > "$out"
      emit "$out"
    done
  done

  echo "Done. Results in bench_lik/results/maxsim_vram_*.json"
  ls -la bench_lik/results/maxsim_vram_*.json
